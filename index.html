<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Open-LLM-Vtuber</title>
    <script>
      window.vtuberVolume = parseFloat(localStorage.getItem('vtuberVolume') || '1.0');
    </script>
    <script src="./libs/avatar-runtime.js"></script>
    <script type="module" crossorigin src="./assets/main-llmprovider-stage4.2.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/main-QEkl09-0.css">
    <style id="olv-studio-scrollbar-theme">
      :root, html, body {
        color-scheme: dark;
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(96, 165, 250, 0.38) rgba(15, 23, 42, 0.25);
      }
      *::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      *::-webkit-scrollbar-button {
        display: none;
        width: 0;
        height: 0;
      }
      *::-webkit-scrollbar-track {
        background: rgba(15, 23, 42, 0.25);
        border-radius: 999px;
      }
      *::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, rgba(96, 165, 250, 0.45) 0%, rgba(59, 130, 246, 0.35) 100%);
        border-radius: 999px;
        border: 1px solid rgba(147, 197, 253, 0.18);
      }
      *::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(180deg, rgba(96, 165, 250, 0.78) 0%, rgba(59, 130, 246, 0.65) 100%);
      }
      *::-webkit-scrollbar-corner {
        background: transparent;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
  </body>
</html>
